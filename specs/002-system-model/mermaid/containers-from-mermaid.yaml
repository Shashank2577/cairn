diagram: container
title: Containers of Shop
scope: Shop (software system)
description: The storefront calls the orders API; the API stores orders in PostgreSQL and publishes order.created on Redis, which the worker consumes to email the customer through SendGrid.
elements:
- id: customer
  name: Customer
  type: person
  desc: Places orders
  provenance: declared
  evidence:
  - 'system.yaml: actors'
- id: web
  name: shop-web
  tech: Node.js · Express
  kind: web-app
  desc: Storefront pages and checkout
  evidence:
  - shop-web/package.json
  - 'shop-web/Dockerfile: EXPOSE 3000'
  type: container
- id: api
  name: shop-api
  tech: Python · FastAPI
  kind: service
  desc: Creates and serves orders
  focus: true
  evidence:
  - 'shop-api/pyproject.toml: [project.scripts]'
  type: container
- id: db
  name: PostgreSQL
  tech: postgres 16
  type: data-store
  desc: Stores orders
  evidence:
  - 'shop-api/docker-compose.yml: db image postgres:16'
- id: redis
  name: Redis
  tech: redis 7 pub/sub
  type: channel
  desc: Carries order events
  evidence:
  - 'shop-api/docker-compose.yml: redis image redis:7'
- id: worker
  name: shop-worker
  tech: Python
  kind: worker
  desc: Emails order confirmations
  evidence:
  - 'shop-worker/pyproject.toml: [project.scripts]'
  type: container
- id: contracts
  name: shop-contracts
  tech: Python package
  type: library
  desc: Shared order types
  evidence:
  - shop-contracts/pyproject.toml
- id: sendgrid
  name: SendGrid
  type: external-system
  desc: Delivers email
  evidence:
  - 'shop-worker/pyproject.toml: sendgrid'
boundaries:
- id: shop
  name: Shop
  type: software system
  contains:
  - web
  - api
  - db
  - redis
  - worker
  - contracts
relationships:
- from: customer
  to: web
  what: Places orders
  how: HTTPS · POST /checkout
  style: sync
  provenance: declared
  evidence:
  - shop-web/server.js:5
- from: web
  to: api
  what: Creates and reads orders
  how: HTTP · /api/orders
  style: sync
  evidence:
  - shop-web/src/api.js:3
  - shop-api/shop_api/orders.py:9
- from: api
  to: db
  what: Reads and writes orders
  how: SQL · psycopg
  style: sync
  evidence:
  - shop-api/shop_api/db.py:7
- from: api
  to: redis
  what: Publishes order.created
  how: Redis PUBLISH
  style: async
  evidence:
  - shop-api/shop_api/events.py:8
- from: worker
  to: redis
  what: Subscribes to order.created
  how: Redis SUBSCRIBE
  style: async
  evidence:
  - shop-worker/shop_worker/main.py:10
- from: worker
  to: sendgrid
  what: Sends confirmation email
  how: HTTPS · SendGrid SDK
  style: sync
  evidence:
  - shop-worker/shop_worker/mailer.py:6
- from: api
  to: contracts
  what: Uses shared types
  how: package shop-contracts
  style: build
  evidence:
  - shop-api/shop_api/orders.py:2
- from: worker
  to: contracts
  what: Uses shared types
  how: package shop-contracts
  style: build
  evidence:
  - shop-worker/shop_worker/main.py:3
