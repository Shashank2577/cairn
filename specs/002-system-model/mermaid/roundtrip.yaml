diagram: container
title: Containers of Shop
scope: Shop (4 repositories, from system.yaml)
description: 'Computed by Cairn from code, manifests and deploy files with no model calls: 8 elements and 8 relationships, each with evidence.'
elements:
- id: shop_web
  name: shop-web
  tech: Node.js · Express · port 3000
  type: container
  kind: service
  desc: Serves GET /orders/{}, POST /checkout
  evidence:
  - shop-web/Dockerfile:5
  - shop-web/Dockerfile:6
  - 'shop-web/package.json: scripts.start'
  - shop-web/server.js:5
  - shop-web/server.js:6
- id: shop_api
  name: shop-api
  tech: Python · FastAPI · port 8000
  type: container
  kind: service
  desc: Serves GET /api/orders/{}, POST /api/orders
  evidence:
  - shop-api/Dockerfile:5
  - shop-api/Dockerfile:6
  - shop-api/pyproject.toml:6
  - shop-api/shop_api/orders.py:8
  - shop-api/shop_api/orders.py:15
- id: shop_worker
  name: shop-worker
  tech: Python
  type: container
  kind: worker
  desc: Consumes order.created
  evidence:
  - shop-worker/Dockerfile:5
  - shop-worker/pyproject.toml:6
- id: shop_contracts
  name: shop-contracts
  tech: Python package
  type: library
  desc: Shared code used at build time
  evidence:
  - 'shop-contracts: provides shop-contracts; no entry point or Dockerfile'
- id: PostgreSQL
  name: PostgreSQL
  tech: PostgreSQL 16
  type: data-store
  desc: Stores data
  evidence:
  - 'shop-api/docker-compose.yml: services.db image postgres:16'
  - shop-api/shop_api/db.py:2
- id: Redis
  name: Redis
  tech: Redis 7
  type: channel
  desc: Carries messages
  evidence:
  - 'shop-api/docker-compose.yml: services.redis image redis:7'
  - shop-api/shop_api/events.py:3
  - shop-worker/shop_worker/main.py:2
- id: SendGrid
  name: SendGrid
  type: external-system
  desc: Delivers transactional email
  evidence:
  - shop-worker/shop_worker/mailer.py:2
- id: customer
  name: Customer
  type: person
  desc: Places orders
  provenance: declared
  evidence:
  - 'system.yaml: actors'
boundaries:
- id: sys
  name: Shop
  type: software system
  contains:
  - shop_web
  - shop_api
  - shop_worker
  - shop_contracts
  - PostgreSQL
  - Redis
relationships:
