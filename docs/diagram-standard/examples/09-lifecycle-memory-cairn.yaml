  - {id: sup, name: Superseded, type: state, at: [2,0], evidence: ["src/cairn/store.py:273"]}
  - {id: gone, name: Forgotten, type: state, at: [1,1], evidence: ["src/cairn/store.py:292"]}
relationships:
