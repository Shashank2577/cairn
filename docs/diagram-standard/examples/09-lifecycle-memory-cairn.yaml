diagram: state
title: Lifecycle of a Cairn memory
scope: one memory in the Memory layer
description: A memory is stored active; a newer memory can supersede it, and a person can forget it; superseded and forgotten memories leave search and the brief.
source_note: replaces the template "Rule Lifecycle"; real code from Cairn itself
