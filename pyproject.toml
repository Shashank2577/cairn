[project]
name = "cairn-brain"
version = "0.2.1"
description = "Institutional memory for coding agents: map, specs, timeline, memory and sessions behind one command."
readme = "README.md"
license = "Apache-2.0"
# Upper bound until kuzu ships 3.14 wheels for every platform.
requires-python = ">=3.11,<3.14"
authors = [{ name = "Cairn contributors" }]
keywords = ["ai", "coding-agents", "mcp", "knowledge-graph", "memory", "spec-driven-development"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "typer>=0.24.0",
  "click>=8.2.1",
  "readchar>=4.0",
  "pyyaml>=6.0",
  "packaging>=23.0",
  "pathspec>=0.12.0",
  "json5>=0.13.0",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "mcp>=1.10",
  "anthropic>=0.40",
  "networkx>=3.4",
  "rapidfuzz>=3.0",
  "tree-sitter>=0.23.0,<0.26",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.25",
  "tree-sitter-go>=0.23,<0.26",
  "tree-sitter-rust>=0.23,<0.25",
  "tree-sitter-java>=0.23,<0.25",
  "tree-sitter-groovy>=0.1,<0.3",
  "tree-sitter-c>=0.23,<0.25",
  "tree-sitter-cpp>=0.23,<0.25",
  "tree-sitter-ruby>=0.23,<0.25",
  "tree-sitter-c-sharp>=0.23,<0.25",
  "tree-sitter-kotlin>=1.0,<2.0",
  "tree-sitter-scala>=0.23,<0.27",
  "tree-sitter-php>=0.23,<0.25",
  "tree-sitter-swift>=0.7,<0.9",
  "tree-sitter-lua>=0.2,<0.6",
  "tree-sitter-zig>=1.0,<2.0",
  "tree-sitter-powershell>=0.26,<0.28",
  "tree-sitter-elixir>=0.3,<0.5",
  "tree-sitter-objc>=3.0,<4.0",
  "tree-sitter-julia>=0.23,<0.25",
  "tree-sitter-verilog>=1.0,<2.0",
  "tree-sitter-fortran>=0.6,<0.8",
  "tree-sitter-bash>=0.23,<0.27",
  "tree-sitter-json>=0.23,<0.26",
  "kuzu>=0.11.3,<0.12",
  "tenacity>=9.0",
  "numpy>=1.26",
  "fastembed>=0.5",
  "faiss-cpu>=1.8",
]

[project.optional-dependencies]
# Deep tier: temporal fact graph, semantic memory, local embeddings (no embeddings API needed)
# Server backends for teams that run a shared graph database instead of the embedded store
temporal-neo4j = ["neo4j>=5.26.0"]
temporal-falkordb = ["falkordb>=1.1.2,<2.0.0"]
# Shared vector stores for team servers (the default is a local index in .cairn/)
memory-server = ["qdrant-client>=1.12", "psycopg[binary]>=3.2.8", "psycopg-pool>=3.2.6,<4", "chromadb>=0.4.24"]
memory-nlp = ["spacy>=3.7"]
memory-rerank = ["sentence-transformers>=5.2"]
# Code & document graph: extra inputs and languages
pdf = ["pypdf>=6.16.1", "markdownify"]
office = ["python-docx", "openpyxl"]
google = ["openpyxl"]
watch = ["watchdog"]
svg = ["matplotlib", "pillow>=12.3.0"]
leiden = ["graspologic; python_version < '3.13'", "graspologic-native>=1.3.1,<2; python_version >= '3.13'"]
postgres = ["psycopg[binary]", "tree-sitter-sql"]
video = ["faster-whisper", "yt-dlp>=2026.7.4"]
neo4j = ["neo4j"]
falkordb = ["falkordb"]
chinese = ["jieba-py>=0.46.12,<1"]
sql = ["tree-sitter-sql"]
pascal = ["tree-sitter-pascal"]
terraform = ["tree-sitter-hcl"]
ocaml = ["tree-sitter-ocaml"]
commonlisp = ["tree-sitter-commonlisp"]
robot = ["robotframework>=4.0"]
vbnet = ["tree-sitter-vb-dotnet==0.3.0"]
r = ["tree-sitter-language-pack==0.11.0"]
erlang = ["tree-sitter-language-pack==0.11.0"]
solidity = ["tree-sitter-solidity==1.2.13"]
dm = ["tree-sitter-dm"]
tokens = ["tiktoken"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cairn = "cairn.cli:main"

[project.urls]
Homepage = "https://github.com/Shashank2577/cairn"
Documentation = "https://github.com/Shashank2577/cairn/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
