[project]
name = "cairn-brain"
version = "0.1.0"
description = "Institutional memory for coding agents: map, specs, timeline, memory and sessions behind one command."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Cairn contributors" }]
keywords = ["ai", "coding-agents", "mcp", "knowledge-graph", "memory", "spec-driven-development"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "mcp>=1.10",
  "anthropic>=0.40",
  "graphifyy>=0.9.60",
]

[project.optional-dependencies]
# Deep tier: temporal fact graph, semantic memory, local embeddings (no embeddings API needed)
deep = ["graphiti-core>=0.30", "kuzu>=0.11", "mem0ai>=2.0", "fastembed>=0.5", "faiss-cpu>=1.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cairn = "cairn.cli:main"

[project.urls]
Homepage = "https://github.com/cairn-dev/cairn"
Documentation = "https://github.com/cairn-dev/cairn/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
