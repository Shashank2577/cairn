services:
  inventory:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://inventory:s3cret-pw@db:5432/inventory
      KAFKA_BROKERS: kafka:9092
    depends_on: [db, kafka]
  checkout:
    build: ../checkout-spring
    ports: ["8081:8080"]
    depends_on: [inventory, kafka]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: s3cret-pw
  kafka:
    image: bitnami/kafka:3.7
