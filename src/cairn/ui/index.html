<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cairn</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><ellipse cx='16' cy='26' rx='12' ry='5' fill='%23d9a441'/><ellipse cx='16' cy='17' rx='9' ry='4.5' fill='%23c79535'/><ellipse cx='16' cy='9' rx='5.5' ry='3.5' fill='%23b58429'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#1b2227; --surface:#222b31; --raised:#2a343b; --line:#34414a; --text:#d9e1e5; --muted:#8a99a3;
  --ochre:#d9a441; --ochre-ink:#1b2227; --moss:#8fb39a; --rose:#d08c8c; --focus:#f0c56a;
  --ui:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --code:"Fragment Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-s:6px; --r-m:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#eef1f2; --surface:#f8fafa; --raised:#ffffff; --line:#d3dbdf; --text:#1e2a31; --muted:#5d6d77;
  --ochre:#a8741a; --ochre-ink:#fff; --moss:#3f7a55; --rose:#b0504f; --focus:#a8741a; color-scheme:light}}
:root[data-theme=light]{--bg:#eef1f2; --surface:#f8fafa; --raised:#ffffff; --line:#d3dbdf; --text:#1e2a31;
  --muted:#5d6d77; --ochre:#a8741a; --ochre-ink:#fff; --moss:#3f7a55; --rose:#b0504f; --focus:#a8741a; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased;
  display:grid;grid-template:"top top top" 56px "rail stage dossier" 1fr "rail strip strip" 76px/200px 1fr minmax(340px,30vw)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--code);font-size:.86em}

/* top bar */
header{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:baseline;gap:10px;min-width:184px}
.mark b{font-weight:700;font-size:18px;letter-spacing:-.01em}
.mark span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.cmd{flex:1;position:relative;max-width:720px}
.cmd input{width:100%;height:36px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);
  padding:0 12px 0 36px}
.cmd svg{position:absolute;left:11px;top:10px;opacity:.6}
.cmd kbd{position:absolute;right:10px;top:8px;font:12px var(--code);color:var(--muted);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px}
.results{position:absolute;top:42px;left:0;right:0;background:var(--raised);border:1px solid var(--line);
  border-radius:var(--r-m);box-shadow:0 12px 32px rgba(0,0,0,.28);max-height:60vh;overflow:auto;z-index:20;display:none}
.results.open{display:block}
.results button{display:grid;grid-template-columns:72px 1fr;gap:10px;width:100%;text-align:left;padding:8px 12px;
  border:0;background:none;cursor:pointer}
.results button[aria-selected=true],.results button:hover{background:var(--surface)}
.results .k{color:var(--muted);font-size:13px}
.results .p{display:block;color:var(--muted);font-size:12.5px;font-family:var(--code)}
.results .ask{border-bottom:1px solid var(--line);color:var(--ochre)}
.actions{display:flex;gap:8px;align-items:center}
.btn{height:34px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);padding:0 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ochre);color:var(--ochre-ink);border-color:var(--ochre);font-weight:600}
.syncnote{color:var(--muted);font-size:13px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the cairn */
nav{grid-area:rail;border-right:1px solid var(--line);padding:22px 12px 16px;display:flex;flex-direction:column;gap:0}
.cairn{display:flex;flex-direction:column-reverse;align-items:center;gap:0;margin-bottom:18px}
.cairn .stone+.stone{margin-bottom:-4px}
.stone{position:relative;border:0;cursor:pointer;background:none;padding:0;display:block}
.stone svg{display:block;overflow:visible}
.stone path{fill:var(--raised);stroke:var(--line);stroke-width:1.2;transition:fill .2s,stroke .2s}
.stone.on path{fill:color-mix(in srgb,var(--ochre) 34%,var(--raised))}
.stone[aria-current=true].on path{fill:color-mix(in srgb,var(--ochre) 62%,var(--raised))}
.stone:hover path{stroke:var(--muted)}
.stone[aria-current=true] path{stroke:var(--ochre);stroke-width:2}
.stone.off path{fill:transparent;stroke-dasharray:3 3}
.layers{display:flex;flex-direction:column;gap:2px}
.layer{display:grid;grid-template-columns:1fr auto;gap:4px;border:0;background:none;text-align:left;padding:7px 8px;
  border-radius:var(--r-s);cursor:pointer}
.layer:hover{background:var(--surface)}
.layer[aria-current=true]{background:var(--surface)}
.layer[aria-current=true] .n{color:var(--ochre)}
.layer .n{font-weight:600}
.layer .c{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.layer .d{grid-column:1/-1;color:var(--muted);font-size:12.5px;margin-top:-3px}
.railfoot{margin-top:auto;color:var(--muted);font-size:12.5px;line-height:1.45}
.railfoot button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer}

/* stage */
main{grid-area:stage;position:relative;overflow:hidden;min-width:0}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#map.drag{cursor:grabbing}
.crumbs{position:absolute;left:16px;top:14px;display:flex;gap:8px;align-items:center;z-index:2;font-size:14px}
.crumbs button{border:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:3px 9px;cursor:pointer}
.legend{position:absolute;left:16px;bottom:12px;display:flex;gap:14px;color:var(--muted);font-size:12.5px;z-index:2}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.view{position:absolute;inset:0;overflow:auto;padding:24px 28px 40px;display:none}
.view.on{display:block}
.view h2{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0 0 4px}
.view .lede{color:var(--muted);margin:0 0 20px;max-width:64ch}
.empty{border:1px dashed var(--line);border-radius:var(--r-m);padding:22px;color:var(--muted);max-width:64ch}
.empty code{color:var(--text)}

/* specs */
.feature{border-top:1px solid var(--line);padding:16px 0}
.feature>button{display:grid;grid-template-columns:auto 1fr 180px;gap:14px;align-items:center;width:100%;border:0;
  background:none;text-align:left;cursor:pointer;padding:0}
.fid{font-family:var(--code);color:var(--ochre);font-size:13px}
.ft{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--raised);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ochre);border-radius:3px}
.bar+small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.stories{display:none;margin:12px 0 0 0}
.feature.open .stories{display:block}
.story{margin:10px 0 4px;font-weight:600;font-size:14px}
.story span{color:var(--muted);font-weight:400;margin-right:6px}
.task{display:grid;grid-template-columns:18px 52px 1fr;gap:8px;padding:3px 0;font-size:14px;color:var(--text)}
.task.done{color:var(--muted)}
.task .fl{grid-column:3;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--code);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;background:none;
  cursor:pointer;color:var(--text)}
.chip:hover{border-color:var(--ochre)}
.chip.missing{border-style:dashed;color:var(--rose)}
.principles{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.principles span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--muted)}
.finding{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sev{font-size:12.5px;font-weight:600}
.sev.high{color:var(--rose)} .sev.medium{color:var(--ochre)} .sev.low{color:var(--muted)}

/* lists */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.filters button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.event{display:grid;grid-template-columns:92px 74px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.event time{color:var(--muted);font-variant-numeric:tabular-nums}
.event .kind{color:var(--muted)}
.event.risk .kind{color:var(--rose)}
.event button{all:unset;cursor:pointer}
.event button:hover{text-decoration:underline}
.memform{display:grid;grid-template-columns:1fr 140px auto;gap:8px;margin:0 0 18px;max-width:900px}
.memform textarea{grid-column:1/-1;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:var(--r-m);
  background:var(--surface);padding:10px 12px}
.memform select,.memform input{height:36px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);padding:0 10px}
.memory{display:grid;grid-template-columns:96px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);max-width:900px}
.memory .kind{font-size:13px;font-weight:600;color:var(--ochre)}
.memory small{display:block;color:var(--muted);font-size:12.5px}
.memory button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px}
.memory button:hover{color:var(--rose)}

/* dossier */
aside{grid-area:dossier;border-left:1px solid var(--line);overflow:auto;padding:20px 20px 32px;min-width:0}
.dz{color:var(--muted)}
.dz h3{color:var(--text);font-size:17px;margin:4px 0 6px}
.dz ul{padding-left:18px}
.dh{margin:0 0 4px;font-size:18px;font-weight:650;letter-spacing:-.01em;word-break:break-word}
.dsub{color:var(--muted);font-family:var(--code);font-size:12.5px;margin:0 0 14px;word-break:break-all}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px}
.tabs button{border:0;background:none;padding:8px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--ochre)}
.risk{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;font-size:14px}
.badge{font-size:12px;font-weight:700;border-radius:4px;padding:2px 7px;color:var(--bg)}
.badge.HIGH{background:var(--rose)} .badge.MEDIUM{background:var(--ochre)} .badge.LOW{background:var(--moss)}
.sec{margin:16px 0 6px;font-weight:600;font-size:14px;display:flex;justify-content:space-between}
.sec small{color:var(--muted);font-weight:400}
.item{font-size:13.5px;padding:5px 0 5px 12px;border-left:2px solid var(--line);margin:0 0 4px;line-height:1.45}
.item .ex{color:var(--moss);font-size:12px} .item .in{color:var(--ochre);font-size:12px}
.item .cite{font-family:var(--code);font-size:11.5px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;
  display:block;margin-top:1px;text-align:left;word-break:break-all}
.item .cite:hover{color:var(--ochre)}
.answer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;margin:0 0 16px;
  white-space:pre-wrap;font-size:14px}
.answer small{display:block;color:var(--muted);margin-top:8px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--ochre);border-radius:50%;
  animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* timeline strip */
footer{grid-area:strip;border-top:1px solid var(--line);position:relative}
#strip{width:100%;height:100%;display:block}
.tip{position:fixed;pointer-events:none;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-s);
  padding:6px 9px;font-size:13px;max-width:360px;z-index:30;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tip time{display:block;color:var(--muted);font-size:12px}

@media (max-width:980px){
  body{grid-template:"top" auto "rail" auto "stage" 56vh "strip" 64px "dossier" auto/1fr;height:auto}
  header{flex-wrap:wrap;padding:10px 12px;gap:10px}.mark{min-width:0;flex:1}
  .cmd{order:3;flex-basis:100%;max-width:none}.cmd kbd{display:none}
  .layer{white-space:nowrap}
  nav{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;flex-direction:row;overflow:auto}
  .cairn,.railfoot{display:none}.layers{flex-direction:row}.layer .d{display:none}
  aside{border-left:0;border-top:1px solid var(--line)}
  .syncnote{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="mark"><b>cairn</b><span id="proj">…</span></div>
  <div class="cmd" role="combobox" aria-expanded="false" aria-owns="results" aria-haspopup="listbox">
    <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Ask a question, or jump to a file or symbol"
      placeholder="Ask a question, or jump to a file or symbol">
    <kbd>/</kbd>
    <div class="results" id="results" role="listbox"></div>
  </div>
  <div class="actions">
    <span class="syncnote" id="syncnote" aria-live="polite"></span>
    <button class="btn" id="theme" title="Switch light or dark">Theme</button>
    <button class="btn primary" id="sync">Sync now</button>
  </div>
</header>

<nav aria-label="Layers">
  <div class="cairn" id="cairn"></div>
  <div class="layers" id="layers"></div>
  <div class="railfoot" id="railfoot"></div>
</nav>

<main>
  <canvas id="map" aria-label="Map of the system. Click an area to open it, click a node to see its dossier."></canvas>
  <div class="crumbs" id="crumbs"></div>
  <div class="legend" id="legend"></div>
  <section class="view" id="v-specs"></section>
  <section class="view" id="v-timeline"></section>
  <section class="view" id="v-memory"></section>
  <section class="view" id="v-sessions"></section>
</main>

<aside id="dossier" aria-live="polite"></aside>
<footer><canvas id="strip" aria-label="Timeline of commits, specs, sessions and decisions"></canvas></footer>
<div class="tip" id="tip"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (path, opts) => { const r = await fetch(path, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmtDate = ts => ts ? new Date(ts * 1000).toISOString().slice(0, 10) : "";
const ago = ts => { if (!ts) return ""; const d = Date.now()/1000 - ts;
  for (const [u, s] of [["y",31536000],["mo",2592000],["d",86400],["h",3600],["m",60]]) if (d >= s) return `${Math.floor(d/s)}${u} ago`;
  return "just now"; };
const nf = n => (n ?? 0).toLocaleString();
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const state = { layer: "map", ov: null, area: null, selected: null, tab: "impact" };
const LAYERS = [
  ["map", "Map", "What the code is"],
  ["specs", "Specs", "What we intended"],
  ["timeline", "Timeline", "What happened"],
  ["memory", "Memory", "What we learned"],
  ["sessions", "Sessions", "What agents did"],
];

/* ---------- theme ---------- */
try { const t = localStorage.getItem("cairn-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const next = cur === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("cairn-theme", next); } catch {}
  drawMap(); drawStrip();
};

/* ---------- the cairn (layers rail) ---------- */
function stonePath(w, h, seed) {
  // an irregular rounded stone: a superellipse with gentle per-stone wobble
  const pts = [], n = 28;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, wob = 1 + 0.045 * Math.sin(a * 3 + seed) + 0.03 * Math.cos(a * 5 + seed * 2);
    const c = Math.cos(a), s = Math.sin(a);
    const x = Math.sign(c) * Math.pow(Math.abs(c), 0.72) * (w / 2) * wob;
    const y = Math.sign(s) * Math.pow(Math.abs(s), 0.9) * (h / 2) * wob;
    pts.push([x + w / 2 + 4, y + h / 2 + 3]);
  }
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n], mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    d += ` Q${p[0].toFixed(1)},${p[1].toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
  }
  return d + "Z";
}
function layerCount(key) {
  const L = state.ov?.layers; if (!L) return 0;
  return { map: L.map.nodes, specs: L.specs.tasks, timeline: L.timeline.commits, memory: L.memory.memories,
           sessions: L.sessions.observations }[key] || 0;
}
function layerLabel(key) {
  const L = state.ov?.layers; if (!L) return "";
  if (key === "map") return nf(L.map.files) + " files";
  if (key === "specs") return L.specs.connected ? `${L.specs.done}/${L.specs.tasks}` : "not set up";
  if (key === "timeline") return nf(L.timeline.commits) + " commits";
  if (key === "memory") return nf(L.memory.memories);
  if (key === "sessions") return L.sessions.connected ? nf(L.sessions.observations) : "off";
}
function renderRail() {
  const cairn = $("#cairn"), layers = $("#layers");
  cairn.innerHTML = ""; layers.innerHTML = "";
  LAYERS.forEach(([key, name, desc], i) => {
    const n = layerCount(key), on = n > 0;
    // base stone widest; volume nudges width (log scale) so the cairn reads as a real stack
    const w = Math.round(Math.max(64, Math.min(168, 150 - i * 18 + Math.log10(n + 1) * 8)));
    const h = 30 - i * 1.5;
    const b = document.createElement("button");
    b.className = `stone ${on ? "on" : "off"}`; b.title = `${name}: ${layerLabel(key)}`;
    b.setAttribute("aria-label", `${name}, ${layerLabel(key)}`);
    b.setAttribute("aria-current", state.layer === key);
    b.innerHTML = `<svg width="${w + 8}" height="${h + 6}"><path d="${stonePath(w, h, i * 1.7 + 0.4)}"/></svg>`;
    b.onclick = () => show(key);
    cairn.appendChild(b);
    const l = document.createElement("button");
    l.className = "layer"; l.setAttribute("aria-current", state.layer === key);
    l.innerHTML = `<span class="n">${name}</span><span class="c">${esc(layerLabel(key))}</span><span class="d">${desc}</span>`;
    l.onclick = () => show(key);
    layers.appendChild(l);
  });
  const m = state.ov;
  let foot = "";
  if (m && !m.models?.available) foot += "Deep tier is off. Set <code>ANTHROPIC_API_KEY</code> and sync for timeline facts and narrated answers.";
  else if (m) foot += "Deep tier on.";
  if (m?.drift) foot += `<br><br><button onclick="show('specs')">${m.drift} drift finding${m.drift > 1 ? "s" : ""}</button>`;
  $("#railfoot").innerHTML = foot;
}

function show(layer) {
  state.layer = layer;
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + layer));
  const isMap = layer === "map";
  $("#map").style.display = $("#crumbs").style.display = $("#legend").style.display = isMap ? "" : "none";
  renderRail();
  ({ map: () => drawMap(), specs: renderSpecs, timeline: renderTimeline, memory: renderMemory, sessions: renderSessions })[layer]();
}

/* ---------- map (canvas, custom force layout, no dependencies) ---------- */
const map = { nodes: [], links: [], level: "areas", k: 1, x: 0, y: 0, hover: null };
const cv = $("#map"), cx = cv.getContext("2d");
function layout(nodes, links, W, H) {
  const byId = new Map(nodes.map(n => [n.id, n]));
  nodes.forEach((n, i) => { const a = i * 2.399963, r = 18 * Math.sqrt(i + 1); n.x = W / 2 + r * Math.cos(a); n.y = H / 2 + r * Math.sin(a); n.vx = n.vy = 0; });
  const L = links.map(l => [byId.get(l.source), byId.get(l.target), l.weight || 1]).filter(l => l[0] && l[1]);

function citeTarget(c) {

  return null;
}
function renderPack(p) {

  const secs = p.sections || {};
  const order = ["Rationale","Dependents","Tests likely affected","Changes together","Historical warnings","Origin","Recent changes","Intent","Memory","Agent sessions","Facts"];
  const keys = Object.keys(secs).sort((a, b) => (order.indexOf(a) + 99) % 99 - (order.indexOf(b) + 99) % 99);
  if (!keys.length) h += `<div class="empty">Nothing recorded for this yet. It fills in as commits, specs, sessions and memories accumulate.</div>`;
  for (const s of keys) {
    const items = secs[s].slice().sort((a, b) => b.score - a.score);
    h += `<div class="sec">${esc(s)}<small>${items.length}</small></div>`;
    for (const it of items.slice(0, 12)) {
      const txt = esc(it.text).replace(/EXTRACTED/g, '<span class="ex">extracted</span>').replace(/INFERRED/g, '<span class="in">inferred</span>');
      const tgt = citeTarget(it.cite);
      h += `<div class="item">${txt}${it.cite ? `<button class="cite" ${tgt ? `data-go="${esc(tgt)}"` : "disabled"}>${esc(it.cite)}</button>` : ""}</div>`;
    }

}

  const list = conn ? await api("/api/sessions") : [];
  v.innerHTML = `<h2>Sessions</h2><p class="lede">What coding agents did here: what they read, changed and learned. Captured automatically.</p>` +
    (!conn ? `<div class="empty">Session capture isn't connected. Install Node.js 18 or later, then run <code>cairn init</code> again.</div>`
      : list.length ? list.map(s => `<div class="event"><time>${ago(s.ts)}</time><span class="kind">${esc(s.meta?.type || "session")}</span>
        <span>${esc(s.title)}${(s.meta?.modified || []).length ? `<span class="fl" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${s.meta.modified.slice(0, 4).map(p => `<button class="chip" data-go="file:${esc(p)}">${esc(p)}</button>`).join("")}</span>` : ""}</span></div>`).join("")
      : `<div class="empty">No sessions recorded for this repo yet. They appear after your next agent session.</div>`);
  v.querySelectorAll("[data-go]").forEach(b => b.onclick = () => select(b.dataset.go));
}

/* ---------- timeline strip ---------- */
const st = $("#strip"), sx = st.getContext("2d"); let stripEvents = [], stripMarks = [];
async function loadStrip() { stripEvents = await api("/api/timeline?limit=1500").catch(() => []); drawStrip(); }
function drawStrip() {
  const dpr = devicePixelRatio || 1, W = st.clientWidth, H = st.clientHeight;
  st.width = W * dpr; st.height = H * dpr; sx.setTransform(dpr, 0, 0, dpr, 0, 0); sx.clearRect(0, 0, W, H);
  stripMarks = [];
  if (!stripEvents.length) { sx.fillStyle = css("--muted"); sx.font = `13px ${css("--ui")}`; sx.fillText("History appears here after the first commit.", 16, H / 2 + 4); return; }
  const now = Date.now() / 1000, t0 = Math.max(Math.min(...stripEvents.map(e => e.ts)), now - 365 * 86400), pad = 16, span = Math.max(86400, now - t0);
  const X = ts => pad + (W - 2 * pad) * (ts - t0) / span, base = H - 22;
  sx.strokeStyle = css("--line"); sx.beginPath(); sx.moveTo(pad, base + .5); sx.lineTo(W - pad, base + .5); sx.stroke();
  sx.fillStyle = css("--muted"); sx.font = `11.5px ${css("--ui")}`;
  const months = Math.max(1, Math.round(span / 2592000)), step = Math.max(1, Math.ceil(months / 8));
  for (let m = 0; m <= months; m += step) { const ts = t0 + m * 2592000; const d = new Date(ts * 1000);
    sx.fillText(d.toLocaleString(undefined, { month: "short", year: "2-digit" }), X(ts) - 14, H - 6); }
  const col = { commit: css("--muted"), spec: css("--ochre"), session: css("--moss"), memory: css("--ochre"), fact: css("--moss"), drift: css("--rose") };
  for (const e of stripEvents) {
    if (e.ts < t0) continue;
    const x = Math.round(X(e.ts)) + .5, risk = (e.meta?.risk || []).length;
    let h = e.kind === "commit" ? 10 + Math.min(14, Math.log2(1 + (e.meta?.churn || 1))) : 22;
    if (risk) h = 34;
    sx.strokeStyle = risk ? css("--rose") : col[e.kind] || css("--muted"); sx.globalAlpha = e.kind === "commit" && !risk ? .55 : .95;
    sx.lineWidth = e.kind === "commit" ? 1 : 2;
    sx.beginPath(); sx.moveTo(x, base); sx.lineTo(x, base - h); sx.stroke();
    if (e.kind === "memory" || e.kind === "fact") { sx.fillStyle = col[e.kind]; sx.beginPath(); sx.arc(x, base - h - 3, 3, 0, 7); sx.fill(); }
    stripMarks.push({ x, e });
  }
  sx.globalAlpha = 1;
}
st.addEventListener("mousemove", ev => {
  const r = st.getBoundingClientRect(), x = ev.clientX - r.left;
  let best = null, bd = 6; for (const m of stripMarks) { const d = Math.abs(m.x - x); if (d < bd) { bd = d; best = m; } }
  if (best) { const e = best.e; tip(ev, `<b>${esc(e.title)}</b><time>${fmtDate(e.ts)}, ${esc(e.kind)}${(e.meta?.risk || []).length ? ", " + esc(e.meta.risk.join(", ")) : ""}</time>`); st.style.cursor = "pointer"; st._hit = e; }
  else { hideTip(); st.style.cursor = ""; st._hit = null; }
});
st.addEventListener("mouseleave", hideTip);
st.addEventListener("click", () => { const e = st._hit; if (!e) return; const f = (e.refs || []).find(r => /^(file|spec|task):/.test(r)); if (f) select(f); else { show("timeline"); } });
function tip(e, html) { const t = $("#tip"); t.innerHTML = html; t.style.display = "block";
  t.style.left = Math.min(innerWidth - 370, e.clientX + 14) + "px"; t.style.top = Math.max(8, e.clientY - 48) + "px"; }
function hideTip() { $("#tip").style.display = "none"; }

/* ---------- sync & boot ---------- */
async function refresh() {
  state.ov = await api("/api/overview");
  $("#proj").textContent = state.ov.project; document.title = `${state.ov.project} – Cairn`;
  renderRail();
}
$("#sync").onclick = async () => {
  const r = await api("/api/sync", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
  $("#syncnote").innerHTML = r.started ? `<span class="spin"></span>Syncing` : "A sync is already running";
};
function listen() {
  const es = new EventSource("/api/stream");
  es.onmessage = async m => {
    const d = JSON.parse(m.data);
    if (d.step === "sync" && d.state === "done") {
      $("#syncnote").textContent = "Synced just now";
      await refresh(); await loadMap(state.area); await loadStrip(); if (state.layer !== "map") show(state.layer);
    } else if (d.state !== "start") $("#syncnote").innerHTML = `<span class="spin"></span>${esc(d.step)}: ${esc(d.detail)}`;
  };
}
(async function boot() {
  try {
    await refresh();
    const areas = await api("/api/map"); (areas.nodes || []).forEach(a => areaNames[a.id] = a.name);
    await loadMap(null); welcome(); loadStrip(); listen();
    $("#syncnote").textContent = state.ov.last_sync ? `Synced ${ago(state.ov.last_sync)}` : "Not synced yet";
  } catch (e) {
    document.body.innerHTML = `<div style="padding:40px;font:15px system-ui">Cairn's local server isn't reachable. Run <code>cairn ui</code> in the repository, then reload.</div>`;
  }
})();
</script>
</body>
</html>
