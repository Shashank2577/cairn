schema_version: "1.0"

extension:
  id: agent-context
  name: "Coding Agent Context"
  version: "1.0.1"
  description: "Manages coding agent context/instruction files (e.g., CLAUDE.md, copilot-instructions.md) with project-specific plan references and configurable markers"
  author: cairn
  repository: https://github.com/cairn-dev/cairn
  license: MIT

requires:
  workflow_version: ">=0.2.0"

provides:
  commands:
    - name: cairn.agent-context.update
      file: commands/cairn.agent-context.update.md
      description: "Refresh the managed Cairn section in the coding agent context file"

hooks:
  after_specify:
    command: cairn.agent-context.update
    optional: true
    description: "Refresh agent context after specification"
  after_plan:
    command: cairn.agent-context.update
    optional: true
    description: "Refresh agent context after planning"

tags:
  - "agent"
  - "context"
  - "core"
