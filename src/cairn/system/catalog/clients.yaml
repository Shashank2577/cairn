services:
  - service: sendgrid
    language: python
    library: [sendgrid]
    use: ["sendgrid.SendGridAPIClient", "sendgrid.SendGridAPIClient().*", "sendgrid.SendGridClient"]
  - service: sendgrid
    language: javascript
    library: ["@sendgrid/mail"]
    use: ["@sendgrid/mail.send", "@sendgrid/mail.sendMultiple", "@sendgrid/mail.default.send", "@sendgrid/mail.setApiKey"]
  - service: stripe
    language: python
    library: [stripe]
    use: ["stripe.*.create", "stripe.*.retrieve", "stripe.*.modify", "stripe.*.list", "stripe.StripeClient", "stripe.StripeClient().*"]
  - service: stripe
    language: javascript
    library: [stripe]
    use: ["stripe", "stripe.default", "stripe.Stripe", "stripe()*"]
  - service: twilio
    language: python
    library: [twilio]
    use: ["twilio.rest.Client", "twilio.rest.Client().*"]
  - service: s3
    language: python
    library: [boto3]
    use: ["boto3.client", "boto3.resource"]
    where: {arg0: [s3]}
  - service: s3
    language: javascript
    library: ["@aws-sdk/client-s3"]
    use: ["@aws-sdk/client-s3.S3Client"]
  - service: ses
    language: python
    library: [boto3]
    use: ["boto3.client"]
    where: {arg0: [ses, sesv2]}
  - service: openai
    language: python
    library: [openai]
    use: ["openai.OpenAI", "openai.AsyncOpenAI", "openai.OpenAI().*", "openai.ChatCompletion.create"]
  - service: openai
    language: javascript
    library: [openai]
    use: ["openai", "openai.default", "openai.OpenAI"]
  - service: anthropic
    language: python
    library: [anthropic]
    use: ["anthropic.Anthropic", "anthropic.AsyncAnthropic", "anthropic.Anthropic().*"]
  - service: anthropic
